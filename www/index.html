<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#01152e">
<link rel="preload" as="image" href="assets/oyun.png"><title>PIECE OF PAST 10</title>
<link rel="stylesheet" href="style.css"></head><body>
<main id="app">
<header>
<div class="pill"><i class="coin"></i><b id="coins">0</b></div>
<div class="lvl"><button id="prevBtn">‹</button><span>BÖLÜM <b id="levelNumber">1</b></span><button id="nextBtn">›</button></div>
<div class="pill"><b id="progressText">0/0</b></div>
<button id="settingsBtn" aria-label="Ayarlar">⚙️</button>
</header>
<section id="board"></section>
<div id="msg"></div>
<div id="preview"></div>
<section id="stage">
<button class="tool" id="hammerBtn" style="left:0">🔨<u id="hammerN">5</u></button>
<button class="tool" id="hintBtn" style="right:0">💡<u id="hintN">10</u></button>
<button id="bonus" aria-label="Ekstra kelimeler"><span id="bonusN">0/10</span></button>
<div id="wheel"><canvas id="path"></canvas>
<button id="shuffleBtn" aria-label="Karıştır"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3c5 0 7 12 12 12h3M3 18h3c1.5 0 2.7-.8 3.7-2M14 8c1-1.2 2.2-2 4-2h3M18 3l3 3-3 3M18 15l3 3-3 3"/></svg></button>
</div>
</section>
</main>
<div id="start" class="ov">
<img id="startImg" src="assets/oyun.png" alt="" decoding="sync" onerror="this.style.display='none';document.getElementById('startTitle').style.display='block'">
<h1 id="startTitle">PIECE OF PAST 10</h1>
<button id="startBtn" class="big">BAŞLAT</button>
</div>
<div id="gift" class="ov hidden">
<h2>GÜNLÜK HEDİYE</h2>
<div id="gwheel"><img id="gstand" src="assets/cark_ayak.png" alt="" onerror="this.style.display='none'"><img id="gimg" src="assets/cark.png" alt="" decoding="async" onerror="this.style.display='none';this.parentNode.classList.add('nofile')"><i id="gptr"></i></div>
<div id="giftRes"></div>
<button id="spinBtn" class="big">ÇEVİR</button>
<button id="giftClose" class="big" style="display:none">TAMAM</button>
</div>
<div id="settings" class="ov hidden">
<h2>AYARLAR</h2>
<div id="volBox"><button id="volIcon" aria-label="Sesi aç/kapat">🔊</button><input id="volRange" type="range" min="0" max="100" step="1" value="100" aria-label="Ses"><b id="volVal">100%</b></div>
<button id="settingsClose" class="big">TAMAM</button>
</div>
<div id="bonusPanel" class="ov hidden">
<h2>EKSTRA KELİMELER</h2>
<div id="xSub">Haritada olmayan her sözlük kelimesi +10 altın. 10 kelimeye ulaşınca +100 altın ödül!</div>
<div id="xInfo"></div>
<div id="xBar"><i></i></div>
<div id="xList"></div>
<button id="xClaim" class="big hidden">ÖDÜLÜ AL +100</button>
<button id="xClose" class="big">TAMAM</button>
</div>
<div id="end" class="ov hidden">
<h2>TEBRİKLER<br>OYUN BİTTİ</h2>
<button id="replayBtn" class="big">BAŞTAN OYNA</button>
</div>
<script src="layout.js"></script><script src="game.js"></script>
</body></html>
