name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build --if-present

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy assets into www
        run: |
          if [ -d assets ]; then
            mkdir -p www/assets
            cp -r assets/. www/assets/
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = next((p for p in ("android-icons/play-store-icon-512.png", "www/android-icons/play-store-icon-512.png") if os.path.exists(p)), None)
          if not src:
              print("play-store-icon-512.png bulunamadi, varsayilan ikon kalacak")
              raise SystemExit
          res = "android/app/src/main/res"
          im = Image.open(src).convert("RGBA")
          px = im.getpixel((2, 2))
          bg = ("#%02x%02x%02x" % px[:3]) if px[3] > 128 else "#FFFFFF"
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              o = f"{res}/mipmap-{d}"
              os.makedirs(o, exist_ok=True)
              a = im.resize((s, s), Image.LANCZOS)
              a.save(f"{o}/ic_launcher.png")
              m = Image.new("L", (s * 4, s * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              r = a.copy()
              r.putalpha(m.resize((s, s), Image.LANCZOS))
              r.save(f"{o}/ic_launcher_round.png")
              f = s * 108 // 48
              k = f * 62 // 100
              c = Image.new("RGBA", (f, f), (0, 0, 0, 0))
              c.paste(im.resize((k, k), Image.LANCZOS), ((f - k) // 2, (f - k) // 2))
              c.save(f"{o}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/pop_icon_bg.xml", "w").write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="pop_icon_bg">{bg}</color>\n</resources>\n')
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/pop_icon_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ("ic_launcher", "ic_launcher_round"):
              open(f"{res}/mipmap-anydpi-v26/{n}.xml", "w").write(xml)
          print("ikon olusturuldu:", src)
          PY

      - name: Remove Capacitor splash logo
        run: |
          python3 - <<'PY2'
          import glob, os, re
          from PIL import Image
          res = "android/app/src/main/res"
          os.makedirs(f"{res}/drawable", exist_ok=True)
          import shutil
          art = next((p for p in ("assets/oyun.png", "www/assets/oyun.png") if os.path.exists(p)), None)
          if art:
              os.makedirs(f"{res}/drawable-nodpi", exist_ok=True)
              shutil.copy(art, f"{res}/drawable-nodpi/oyun_bg.png")
              open(f"{res}/drawable/pop_launch.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/oyun_bg" android:gravity="fill"/>\n')
              print("pencere arka plani: oyun.png")
          else:
              open(f"{res}/drawable/pop_launch.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#01152e"/>\n</shape>\n')
              print("UYARI: assets/oyun.png yok, duz lacivert kullanildi")
          open(f"{res}/drawable/pop_blank.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="#00000000"/>\n    <size android:width="24dp" android:height="24dp"/>\n</shape>\n')
          top = mid = bot = (0x01, 0x15, 0x2e)
          g = Image.new("RGB", (1, 256))
          for y in range(256):
              t = y / 255
              a, b, u = (top, mid, t / .45) if t < .45 else (mid, bot, (t - .45) / .55)
              g.putpixel((0, y), tuple(int(a[i] + (b[i] - a[i]) * u) for i in range(3)))
          for f in glob.glob(f"{res}/**/splash.png", recursive=True):
              w, h = Image.open(f).size
              g.resize((w, h)).save(f)
              print("splash.png degistirildi:", f)
          p = f"{res}/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          m = re.search(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', s, re.S)
          if m:
              blk = m.group(0)
              head = re.match(r"<style[^>]*>", blk).group(0)
              inner = blk[len(head):-len("</style>")]
              inner = re.sub(r'\s*<item name="(android:background|windowSplashScreenBackground|windowSplashScreenAnimatedIcon|windowSplashScreenIconBackgroundColor)">.*?</item>', "", inner, flags=re.S)
              add = '\n        <item name="android:background">@drawable/pop_launch</item>'
              if "SplashScreen" in head:
                  add += '\n        <item name="windowSplashScreenBackground">#01152e</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/pop_blank</item>'
              s = s.replace(blk, head + inner + add + "\n    </style>")
              m2 = re.search(r'<style\s+name="AppTheme\.NoActionBar"[^>]*>.*?</style>', s, re.S)
              if m2:
                  b2 = m2.group(0)
                  b2n = re.sub(r'\s*<item name="android:windowBackground">.*?</item>', "", b2, flags=re.S)
                  b2n = b2n[:-len("</style>")] + '    <item name="android:windowBackground">@drawable/pop_launch</item>\n    </style>'
                  s = s.replace(b2, b2n)
              s = s.replace('<style name="AppTheme.NoActionBarLaunch"', '<style name="AppTheme.NoActionBarLaunch"')
              open(p, "w", encoding="utf-8").write(s)
              print("launch temasi guncellendi")
          else:
              print("UYARI: AppTheme.NoActionBarLaunch bulunamadi")
          PY2

      - name: Fullscreen (hide status and navigation bars)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then echo "MainActivity.java not found"; exit 1; fi
          cat > "$MAIN" <<'EOF'
          package com.pieceofpast10.game;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View cover;
              private long startMs;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setBackgroundDrawableResource(R.drawable.pop_launch);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideSystemBars();

                  // Web sayfa hazir olana kadar oyun.png'yi native olarak goster (gri/bos ekran olmasin)
                  startMs = System.currentTimeMillis();
                  cover = new View(this);
                  cover.setBackgroundResource(R.drawable.pop_launch);
                  addContentView(cover, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  handler.postDelayed(checkReady, 100);
              }

              private final Runnable checkReady = new Runnable() {
                  @Override
                  public void run() {
                      long el = System.currentTimeMillis() - startMs;
                      WebView wv = getBridge() != null ? getBridge().getWebView() : null;
                      boolean ready = wv != null && wv.getProgress() >= 100 && wv.getContentHeight() > 0;
                      if ((ready && el > 500) || el > 6000) {
                          handler.postDelayed(hideCover, 350);
                      } else {
                          handler.postDelayed(this, 100);
                      }
                  }
              };

              private final Runnable hideCover = new Runnable() {
                  @Override
                  public void run() {
                      final View c = cover;
                      if (c == null) return;
                      cover = null;
                      c.animate().alpha(0f).setDuration(200).withEndAction(new Runnable() {
                          @Override
                          public void run() {
                              ViewGroup parent = (ViewGroup) c.getParent();
                              if (parent != null) parent.removeView(c);
                          }
                      }).start();
                  }
              };

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          EOF

      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: pop10-release-keystore-v1

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and align release APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            # Tercih edilen yol: GitHub Secrets'taki kendi anahtarin
            echo "$KS_B64" | base64 -d > secret.keystore
            KS_FILE=secret.keystore; ALIAS="${KS_ALIAS:-key0}"; SPASS="$KS_PASS"; KPASS="${KEY_PASS:-$KS_PASS}"
            echo "Secrets'taki imza anahtari kullaniliyor"
          else
            # Secrets yoksa: anahtari bir kez uret, onbellekte sakla (her build ayni imza olsun, ustune guncelleme kurulabilsin)
            KS_FILE=release.keystore; ALIAS=pop10; SPASS=pop10release; KPASS=pop10release
            if [ ! -f "$KS_FILE" ]; then
              keytool -genkeypair -keystore "$KS_FILE" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$SPASS" -keypass "$KPASS" -dname "CN=Piece of Past 10, OU=Game, O=POP10, C=TR"
              echo "Yeni imza anahtari uretildi"
            else
              echo "Onbellekteki imza anahtari kullaniliyor"
            fi
          fi
          OUT=android/app/build/outputs/apk/release
          UNS=$(find "$OUT" -name '*-unsigned.apk' | head -n 1)
          if [ -z "$UNS" ]; then echo "unsigned release apk bulunamadi"; ls -R "$OUT"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -f -p 4 "$UNS" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS_FILE" --ks-key-alias "$ALIAS" --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" \
            --out "$OUT/piece-of-past-10-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT/piece-of-past-10-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piece-of-past-10-release-apk
          path: android/app/build/outputs/apk/release/piece-of-past-10-release.apk
